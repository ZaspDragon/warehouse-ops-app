<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WarehouseOps Replenishment</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172439;background:#eef2f7}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1450px;margin:auto}
h1{font-size:25px;margin:0 0 6px}h2{font-size:19px}p{line-height:1.45}.muted{color:#64748b}.card{background:white;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #10243b14}
.toolbar,.filters,.stats,.nav{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.nav a,.btn,button{font:inherit;border-radius:8px;padding:10px 13px;border:1px solid #ccd6e4;background:white;color:#172439;cursor:pointer;text-decoration:none}.nav a.active,.primary{background:#145a9f!important;color:white!important;border-color:#145a9f!important}.stats>div{flex:1;min-width:160px;background:#edf5fc;padding:15px;border-radius:10px}.stats strong{display:block;font-size:26px}
label{font-size:13px;font-weight:bold}select,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #cbd5e1;max-width:100%}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:9px}th{background:#f1f5f9;position:sticky;top:0}tr:hover td{background:#f8fafc}
.tag{border-radius:5px;padding:3px 7px;background:#e8f3ff;font-weight:bold}.warning{background:#fff1d6}.done{background:#e4f7ec}.note{font-size:12px;color:#64748b}.hidden{display:none!important}
@media(max-width:700px){body{padding:9px}.card{padding:11px}.nav{gap:5px}.nav a{font-size:12px;padding:8px}.stats>div{min-width:130px}}
@media print{.nav,.toolbar,.filters,.no-print{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}}
</style></head><body><main>
<h1>WarehouseOps · Replenishment Management</h1>
<p class="muted">OH01 report workspace · Import a fresh spreadsheet to populate these tabs. Imported records stay in this browser only.</p>
<nav id="nav" class="nav">
<a data-view="board" href="?view=board">Aisle Board</a><a data-view="all" href="?view=all">Replenishments</a><a data-view="import" href="?view=import">Report Import</a><a data-view="zeros" href="?view=zeros">Zero Primaries</a><a data-view="drivers" href="?view=drivers">Driver Assignments</a>
</nav>
<section class="card toolbar">
<label>Work Date <input id="workDate" type="date"></label>
<button class="primary" id="goImport">Import New Report</button>
<button id="exportBtn">Export Current View CSV</button><button onclick="print()">Print</button>
<span class="muted" id="reportStatus"></span>
</section>
<section id="stats" class="stats"></section>
<section id="content" class="card"></section>
</main>
<script>
(function(){
"use strict";
const KEY="warehouseops-repl-v1",DRIVER_KEY="warehouseops-repl-drivers-v1",ASSIGN_KEY="warehouseops-repl-assign-v1";
const aisleOrder=["A","B","C","D","E","F","G","H","I","J","K","L","RA","RB","RC","RD","RE","RF","RG","XA","XB","XC","XD","XE","XF","XG","FAB","OTHER"];
const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>Number(String(x??"").replace(/,/g,""))||0;
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")};
const fromBin=bin=>{let s=String(bin??"").trim().toUpperCase();if(/^FAB(?:-|$)/.test(s))return "FAB";let m=s.match(/^([A-Z]{1,2})-/);return m?m[1]:"OTHER"};
const view=new URLSearchParams(location.search).get("view")||"board";
const views=["board","all","import","zeros","drivers"];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{date:today(),rows:[],completed:{},source:""}}catch{state={date:today(),rows:[],completed:{},source:""}}
if(!Array.isArray(state.rows))state.rows=[];if(!state.completed)state.completed={};
let drivers;try{drivers=JSON.parse(localStorage.getItem(DRIVER_KEY))||["Dawitt","Dury","Kristopher","Haven","Diamond"]}catch{drivers=["Dawitt","Dury","Kristopher","Haven","Diamond"]}
let assignments;try{assignments=JSON.parse(localStorage.getItem(ASSIGN_KEY))||{}}catch{assignments={}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert("Browser storage is full. Export your data before importing more.")}};
const saveAssignments=()=>localStorage.setItem(ASSIGN_KEY,JSON.stringify(assignments));
const zero=r=>r.available===0;
const prioritySort=(a,b)=>a.priority-b.priority||aisleOrder.indexOf(a.aisle)-aisleOrder.indexOf(b.aisle)||String(a.item).localeCompare(String(b.item));
const currentRows=()=>state.rows;
const el=id=>document.getElementById(id);
function table(rows,cols){return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+escape(c[0])+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+c[1](r)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function rowCols(){return [["Aisle",r=>escape(r.aisle)],["Priority",r=>escape(r.priority)],["Item",r=>escape(r.item)+(r.description?"<div class=\"note\">"+escape(r.description)+"</div>":"")],["Move Qty",r=>r.qty===null?"<span class=\"note\">Not provided</span>":escape(r.qty)],["From Bin",r=>r.from?escape(r.from):"<span class=\"note\">Not supplied</span>"],["To Bin",r=>escape(r.to)],["Primary Qty",r=>escape(r.available)],["Overstock",r=>r.overstock===null?"—":escape(r.overstock)],["Primary Min",r=>escape(r.min)],["Primary Max",r=>r.max===null?"—":escape(r.max)],["Status",r=>'<label><input type="checkbox" class="completed" data-key="'+escape(r.id)+'" '+(state.completed[r.id]?"checked":"")+'> Completed</label>']]}
function summary(){const rows=currentRows(),zeros=rows.filter(zero);el("stats").innerHTML=[["Total Replenishments",rows.length],["Zero Primaries",zeros.length],["Completed",rows.filter(r=>state.completed[r.id]).length],["Pending",rows.filter(r=>!state.completed[r.id]).length]].map(([k,v])=>'<div><span>'+k+'</span><strong>'+v+'</strong></div>').join("");el("reportStatus").textContent=state.source?state.source+" · "+state.date:"No report imported";el("workDate").value=state.date;}
function filters(){return '<div class="filters no-print"><label>Aisle <select id="aisleFilter"><option value="">All aisles</option>'+aisleOrder.map(a=>'<option>'+a+'</option>').join("")+'</select></label><label>Status <select id="statusFilter"><option value="">All</option><option value="pending">Pending</option><option value="done">Completed</option></select></label><label>Search item/bin <input id="q" placeholder="Item number or bin"></label></div>'}
function filterRows(rows){let a=el("aisleFilter")?.value||"",s=el("statusFilter")?.value||"",q=(el("q")?.value||"").toLowerCase();return rows.filter(r=>(!a||r.aisle===a)&&(!s||(s==="done"?! !state.completed[r.id]:!state.completed[r.id]))&&(!q||[r.item,r.from,r.to].some(v=>String(v).toLowerCase().includes(q))))}
function renderList(which){let rows=currentRows().filter(r=>which==="zeros"?zero(r):true).slice().sort(prioritySort);el("content").innerHTML='<h2>'+(which==="zeros"?"Zero-Primary Replenishments":"Replenishments by Aisle & Priority")+'</h2><p class="muted">Aisle is calculated from destination bin; priority comes from the imported report. Check off completed jobs below.</p>'+filters()+'<div id="listTable"></div>';function refresh(){el("listTable").innerHTML=table(filterRows(rows),rowCols())}["aisleFilter","statusFilter","q"].forEach(id=>el(id).addEventListener("input",refresh));refresh()}
function board(){let rows=currentRows(),aisles=aisleOrder.map(a=>({aisle:a,replens:rows.filter(r=>r.aisle===a).length,complete:rows.filter(r=>r.aisle===a&&state.completed[r.id]).length}));el("content").innerHTML='<h2>Daily Replenishment & Putaway Aisle Board</h2><p class="muted">Replenishments come from the uploaded report. Putaway counts are entered separately; they are not guessed from replenishment records.</p>'+table(aisles,[["Aisle",r=>escape(r.aisle)],["Replenishments",r=>r.replens],["Completed",r=>r.complete],["Remaining",r=>r.replens-r.complete],["Putaways",r=>'<input class="putaway-count" data-aisle="'+r.aisle+'" type="number" min="0" style="width:90px" value="'+(num(state.putaways?.[r.aisle]))+'">'],["Total Work",r=>r.replens+num(state.putaways?.[r.aisle])]])+'<p class="note">Putaway entries are stored locally alongside the imported snapshot.</p>'}
function importPage(){
el("content").innerHTML='<h2>Import Replenishments</h2><h3>Paste from BinMgr</h3><p>Copy the replenishment table in BinMgr and paste it below. Supports the table as tab-separated text or the Markdown table format. No Excel file is needed.</p><textarea id="pasteBinMgr" rows="10" style="display:block;width:100%;font:13px monospace;border:1px solid #cbd5e1;border-radius:8px;padding:10px" placeholder="Item   Select   Qty To Move   From Bin   To Bin   Qty Avail   Qty In Overstock   Primary Bin Min   Primary Bin Max   Priority"></textarea><div class="toolbar no-print"><button id="previewPaste" class="primary">Preview Pasted Restocks</button><button id="commitPaste" disabled>Import Previewed Rows</button></div><div id="pasteFeedback" role="status"></div><div id="pastePreview"></div><hr><h3>Or upload an Excel / CSV report</h3><p>Existing Excel import still works, including Bin Restock Report and Replenishment Report templates.</p><label>Choose file <input type="file" id="upload" accept=".xlsx,.xls,.csv"></label><p class="note">Import replaces the current replenishment snapshot and its completion/assignment marks in this browser. It does not modify BinMgr or other WarehouseOps records. Data stays in your browser.</p><div id="importFeedback"></div><hr><button class="no-print" id="clearReport">Clear Local Replenishment Snapshot</button>';
let staged=null;
el("previewPaste").onclick=()=>{
 try{
  staged=parseBinMgrPaste(el("pasteBinMgr").value);
  const total=staged.length,zeros=staged.filter(r=>r.available===0).length;
  el("pasteFeedback").textContent="Preview: "+total+" replenishment rows, "+zeros+" zero primaries. Review the first 10 rows, then import.";
  el("pastePreview").innerHTML=table(staged.slice(0,10),rowCols());
  el("commitPaste").disabled=false;
 }catch(err){staged=null;el("commitPaste").disabled=true;el("pastePreview").innerHTML="";el("pasteFeedback").textContent="Paste error: "+err.message}
};
el("pasteBinMgr").oninput=()=>{staged=null;el("commitPaste").disabled=true;el("pastePreview").innerHTML="";el("pasteFeedback").textContent=""};
el("commitPaste").onclick=()=>{
 if(!staged||!staged.length)return;
 if(state.rows.length&&!confirm("Replace the current replenishment snapshot and reset completion/driver assignments?"))return;
 const count=staged.length;
 state.rows=staged;state.completed={};state.putaways={};assignments={};saveAssignments();state.source="BinMgr pasted table";state.date=el("workDate").value||today();persist();render();
 el("pasteFeedback").textContent="Imported "+count+" BinMgr replenishments successfully.";
 el("pastePreview").innerHTML="";
};
el("upload").addEventListener("change",importFile);
el("clearReport").addEventListener("click",()=>{if(confirm("Clear the imported report and completion marks in this browser?")){state.rows=[];state.completed={};state.putaways={};state.source="";persist();render()}});
}
function parseBinMgrPaste(raw){
 const lines=String(raw||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 if(!lines.length)throw Error("Paste the rows copied from BinMgr first.");
 // Markdown tables have outer pipes; browser clipboard tables normally contain tabs.
 let entries=lines.map(line=>{
   if(line.startsWith("|")&&line.endsWith("|"))return line.slice(1,-1).split("|").map(x=>x.trim());
   if(line.includes("\t"))return line.split("\t").map(x=>x.trim());
   return line.split(/\s{2,}/).map(x=>x.trim());
 });
 const clean=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");
 const headerIndex=entries.findIndex(row=>row.some(x=>clean(x)==="item")&&row.some(x=>clean(x)==="qtytomove")&&row.some(x=>clean(x)==="frombin")&&row.some(x=>clean(x)==="tobin"));
 if(headerIndex<0)throw Error("Couldn't find BinMgr headers: Item, Qty To Move, From Bin, To Bin. Include the header row when copying.");
 const head=entries[headerIndex].map(clean);
 const col=(...names)=>head.findIndex(h=>names.some(n=>h===clean(n)));
 const m={item:col("Item"),qty:col("Qty To Move"),from:col("From Bin"),to:col("To Bin"),available:col("Qty Avail"),overstock:col("Qty In Overstock"),min:col("Primary Bin Min"),max:col("Primary Bin Max"),priority:col("Priority")};
 if(Object.values(m).some(i=>i<0))throw Error("Missing one or more BinMgr columns. Copy the full table including quantities, bins and priority.");
 const result=[],seen=new Map();let invalid=0;
 for(let i=headerIndex+1;i<entries.length;i++){
   let r=entries[i];
   if(r.length!==head.length){invalid++;continue}
   if(r.every(x=>/^:?-+:?$/.test(x)||!x))continue;
   const item=String(r[m.item]||"").trim(),from=String(r[m.from]||"").trim(),to=String(r[m.to]||"").trim();
   const digits=/^-?\d+(?:\.\d+)?$/;
   if(!/^\d{4,}$/.test(item)||!from||!to||![m.qty,m.available,m.overstock,m.min,m.max,m.priority].every(k=>digits.test(String(r[k]).replace(/,/g,"")))){invalid++;continue}
   const qty=num(r[m.qty]);
   if(qty<=0){invalid++;continue}
   let identity=[item,from,to,qty].join("|"),occur=(seen.get(identity)||0)+1;seen.set(identity,occur);
   result.push({id:identity+"|"+occur,item,qty,from,to,aisle:fromBin(to),available:num(r[m.available]),overstock:num(r[m.overstock]),min:num(r[m.min]),max:num(r[m.max]),priority:num(r[m.priority]),reportType:"binmgr-paste"});
 }
 if(!result.length)throw Error("No valid replenishment rows found. Try copying the table into a spreadsheet first and copying those cells.");
 if(invalid)throw Error(invalid+" row(s) could not be read. Nothing imported. Ensure all rows have the complete 10 columns.");
 return result;
}
const normalized=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");
function readHeader(row){let arr=row.map(normalized);function idx(...names){return arr.findIndex(x=>names.some(n=>x===normalized(n)))}return {item:idx("Item","Item Number","Item #"),qty:idx("Qty To Move","Move Qty","Quantity To Move"),from:idx("From Bin","Source Bin"),to:idx("To Bin","Destination Bin"),available:idx("Qty Avail","Bin Qty","Primary Qty","Current Primary Quantity"),overstock:idx("Qty In Overstock","Overstock Qty"),min:idx("Primary Bin Min","Primary Min"),max:idx("Primary Bin Max","Primary Max"),priority:idx("Priority","Age / Priority")}}
async function importFile(e){let file=e.target.files?.[0];if(!file)return;try{if(!window.XLSX)throw Error("Excel reader is unavailable. Check the internet connection.");let wb=XLSX.read(await file.arrayBuffer(),{type:"array"});let name=wb.SheetNames.find(s=>/replenishment report.*paste data/i.test(s))||wb.SheetNames.find(s=>/replenishment report/i.test(s))||wb.SheetNames[0];let data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""});// Native Chadwell Bin Restock Report: headers normally begin on row 3.
let restockHeader=-1,restockCols=null;
for(let i=0;i<Math.min(35,data.length);i++){
 const h=data[i].map(normalized);
 const at=(...names)=>h.findIndex(x=>names.some(n=>x===normalized(n)));
 const m={item:at("Item Number"),description:at("Item Desc"),to:at("Bin"),available:at("Qty"),min:at("Min Stock"),priority:at("Priority"),uom:at("UOM"),from:at("Pull From"),purchase:at("Purch Qty")};
 if(m.item>=0&&m.to>=0&&m.available>=0&&m.min>=0&&m.priority>=0){restockHeader=i;restockCols=m;break}
}
if(restockHeader>=0){
 const m=restockCols,rows=[],seen=new Map();
 for(let i=restockHeader+1;i<data.length;i++){
  const r=data[i],item=String(r[m.item]??"").trim(),to=String(r[m.to]??"").trim();
  if(!item||!to||!/^\d{4,}$/.test(item))continue;
  const from=m.from>=0?String(r[m.from]??"").trim():"";
  const available=num(r[m.available]),min=num(r[m.min]),priority=num(r[m.priority]);
  const signature=[item,from,to].join("|"),occurrence=(seen.get(signature)||0)+1;seen.set(signature,occurrence);
  rows.push({id:signature+"|"+occurrence,item,description:m.description>=0?String(r[m.description]??"").trim():"",qty:null,from,to,aisle:fromBin(to),available,overstock:null,min,max:null,priority,uom:m.uom>=0?String(r[m.uom]??"").trim():"",purchase:m.purchase>=0?num(r[m.purchase]):null,reportType:"bin-restock"});
 }
 if(!rows.length)throw Error("No valid Bin Restock Report rows found.");
 state.rows=rows;state.completed={};state.putaways={};assignments={};saveAssignments();state.source=file.name;state.date=el("workDate").value||today();persist();render();
 el("importFeedback").textContent="Imported "+rows.length+" bin restock lines. Qty = current bin quantity; Purch Qty = purchase quantity. Move quantity was not supplied.";
 return;
}
let pos=-1,map;for(let i=0;i<Math.min(35,data.length);i++){let t=readHeader(data[i]);if(t.item>=0&&t.qty>=0&&t.from>=0&&t.to>=0){pos=i;map=t;break}}if(pos<0)throw Error("Could not find Item, Qty To Move, From Bin and To Bin columns.");let rows=[],seen=new Map();for(let i=pos+1;i<data.length;i++){let r=data[i],item=String(r[map.item]??"").trim(),to=String(r[map.to]??"").trim();if(!item||!to||!String(r[map.qty]??"").trim())continue;let from=String(r[map.from]??"").trim(),qty=num(r[map.qty]);if(qty<=0)continue;let signature=[item,from,to,qty].join("|");let occurrence=(seen.get(signature)||0)+1;seen.set(signature,occurrence);rows.push({id:signature+"|"+occurrence,item,qty,from,to,aisle:fromBin(to),available:map.available>=0?num(r[map.available]):null,overstock:map.overstock>=0?num(r[map.overstock]):null,min:map.min>=0?num(r[map.min]):null,max:map.max>=0?num(r[map.max]):null,priority:map.priority>=0?num(r[map.priority]):999})}if(!rows.length)throw Error("No valid replenishment rows were found.");state.rows=rows;state.completed={};state.putaways={};assignments={};saveAssignments();state.source=file.name;state.date=el("workDate").value||today();persist();render();el("importFeedback").textContent="Imported "+rows.length+" replenishment lines from "+name+"."}catch(err){el("importFeedback").textContent="Import error: "+err.message}}
function driverPage(){let zeros=currentRows().filter(r=>zero(r)&&r.from).slice().sort(prioritySort),active=drivers.filter(Boolean);let alloc={};active.forEach(x=>alloc[x]=0);let rows=zeros.map(r=>{let assigned=assignments[r.id];if(!active.includes(assigned)){assigned=active.find(d=>alloc[d]<45)||"UNASSIGNED"}if(assigned!=="UNASSIGNED")alloc[assigned]=(alloc[assigned]||0)+1;return {...r,driver:assigned}});el("content").innerHTML='<h2>Zero Replenishment Lift-Driver Assignments</h2><p class="muted">Up to 45 assignments per active driver. Zero-quantity rows without a Pull From bin are excluded until a source is identified. Move quantities must be verified separately for Bin Restock Report uploads. Assignments remain in this browser. Choose the drivers below, separated by commas.</p><div class="filters no-print"><label>Active drivers <input id="driverNames" style="min-width:340px" value="'+escape(drivers.join(", "))+'"></label><button id="saveDrivers">Update Drivers</button></div><div class="stats">'+active.map(d=>'<div><span>'+escape(d)+'</span><strong>'+alloc[d]+' / 45</strong></div>').join("")+'</div>'+table(rows,[["Driver",r=>'<select class="driver" data-key="'+escape(r.id)+'">'+[...active,"UNASSIGNED"].map(d=>'<option '+(d===r.driver?"selected":"")+'>'+escape(d)+'</option>').join("")+'</select>'],...rowCols()])+'<p class="note">This tracks job completion in the browser; it does not post bin transfers to Great Plains.</p>';el("saveDrivers").onclick=()=>{drivers=[...new Set(el("driverNames").value.split(",").map(s=>s.trim()).filter(Boolean))];localStorage.setItem(DRIVER_KEY,JSON.stringify(drivers));render()}}
function exportCSV(){let rows=currentRows().filter(r=>view!=="zeros"&&view!=="drivers"||zero(r));let header=["Date","Aisle","Item","Description","Priority","Qty To Move","From Bin","To Bin","Primary Qty","Overstock","Primary Min","Primary Max","Purch Qty","UOM","Completed","Driver"];let vals=rows.map(r=>[state.date,r.aisle,r.item,r.description||"",r.priority,r.qty,r.from,r.to,r.available,r.overstock,r.min,r.max,r.purchase,r.uom||"",state.completed[r.id]?"Yes":"No",assignments[r.id]||""]);let csv=[header,...vals].map(row=>row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="replenishment-"+(views.includes(view)?view:"board")+"-"+state.date+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){summary();document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.dataset.view===view));if(view==="import")importPage();else if(view==="drivers")driverPage();else if(view==="zeros")renderList("zeros");else if(view==="all")renderList("all");else board()}
el("workDate").addEventListener("change",e=>{state.date=e.target.value;persist();summary()});el("goImport").onclick=()=>location.href="?view=import";el("exportBtn").onclick=exportCSV;
document.addEventListener("change",e=>{if(e.target.classList.contains("completed")){state.completed[e.target.dataset.key]=e.target.checked;persist();render()}if(e.target.classList.contains("putaway-count")){state.putaways=state.putaways||{};state.putaways[e.target.dataset.aisle]=Math.max(0,num(e.target.value));persist();render()}if(e.target.classList.contains("driver")){assignments[e.target.dataset.key]=e.target.value;saveAssignments();render()}});
render();
})();
</script></body></html>
